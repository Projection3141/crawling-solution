name: Release Windows App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1단계: 태그가 생성된 저장소 코드를 체크아웃한다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2단계: 프로젝트가 요구하는 Node.js 버전을 준비한다.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3단계: package.json 버전과 Git 태그가 일치하는지 먼저 확인한다.
      - name: Verify release version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          if ($package.version -ne $tagVersion) {
            throw "package.json version '$($package.version)' does not match tag '$tagVersion'."
          }

      # 4단계: lock 파일이 있으면 npm ci, 없으면 npm install을 사용한다.
      # postinstall에서 Playwright Chromium도 프로젝트 내부에 설치된다.
      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      # 5단계: 전체 JavaScript 구문을 검사한다.
      - name: Check JavaScript syntax
        run: npm run check

      # 6단계: Windows x64 Squirrel 설치 파일을 생성한다.
      - name: Build Windows installer
        run: npm run make -- --arch=x64

      # 7단계: Forge 결과물을 GitHub Release asset으로 업로드한다.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path out/make -Recurse -File |
            Where-Object {
              $_.Name -eq "RELEASES" -or
              $_.Extension -in ".exe", ".nupkg"
            } |
            ForEach-Object { $_.FullName }

          if (-not $assets) {
            throw "Electron Forge release assets were not found under out/make."
          }

          gh release create "${{ github.ref_name }}" @assets `
            --verify-tag `
            --generate-notes `
            --title "Mall Collector ${{ github.ref_name }}"